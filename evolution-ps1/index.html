<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Fénix Galáctico PS1 Remaster</title><style>*{box-sizing:border-box}body{margin:0;background:#060b19;color:#e7f8ff;font:15px system-ui;text-align:center}main{max-width:520px;margin:auto;padding:8px}h2{margin:5px}canvas{width:100%;max-width:480px;aspect-ratio:3/4;border:2px solid #55bde9;display:block;margin:auto;touch-action:none;background:#000}.controls{display:flex;justify-content:space-around;align-items:center;margin:12px}#pad{width:140px;height:140px;border-radius:50%;border:3px solid #7acaff;background:radial-gradient(circle,#244c76,#0a1730);position:relative;touch-action:none}#knob{width:56px;height:56px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 25% 25%,#e0ffff,#1a79b3)}button{background:#173657;color:white;border:2px solid #63c8f9;border-radius:14px;padding:13px;font-weight:bold;font-size:16px}#fire{background:#8d2452;border-radius:50%;width:115px;height:85px;touch-action:none}small{display:block;margin:8px}</style></head><body><main><h2>FÉNIX GALÁCTICO · PS1 REMASTER</h2><div id="hud">Puntos 0 · Vidas 3 · Nivel 1 · Escudo 100%</div><canvas id="game" width="480" height="640"></canvas><div class="controls"><div id="pad"><div id="knob"></div></div><button id="fire">DISPARAR</button></div><button id="start">INICIAR / REINICIAR</button> <button id="mute">♫ Música ON</button><small>Naves poligonales metálicas, motores animados, escudo, oleadas y jefes. Joystick o flechas; disparo con botón o espacio.</small></main><script>
(()=>{'use strict';const c=document.querySelector('#game'),g=c.getContext('2d'),hud=document.querySelector('#hud');let p,bullets=[],foes=[],eb=[],sparks=[],stars=[],boss=null,score=0,lives=3,level=1,shield=100,alive=false,tm=0,spawn=0,kill=0,fireCd=0,enemyCd=0,last=0,joy={x:0,y:0},keys={},shooting=false,audio=null,music=true,beat=0,nextBeat=0,inv=0;const R=Math.random;function init(){p={x:240,y:560,tilt:0};bullets=[];foes=[];eb=[];sparks=[];stars=Array.from({length:110},()=>({x:R()*480,y:R()*640,s:R()*2+1}));boss=null;score=0;lives=3;level=1;shield=100;alive=true;tm=0;spawn=.3;kill=0;fireCd=0;enemyCd=0;inv=0;last=0;hudUpdate();unlock()}function hudUpdate(){hud.textContent='Puntos '+score+' · Vidas '+lives+' · Nivel '+level+' · Escudo '+Math.ceil(shield)+'%'}function unlock(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}}function tone(f,d=.1,v=.05,type='sawtooth'){if(!audio||audio.state!=='running')return;const t=audio.currentTime,o=audio.createOscillator(),a=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(40,f*.55),t+d);a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(a);a.connect(audio.destination);o.start(t);o.stop(t+d)}function musicStep(){if(!music||!audio||audio.state!=='running'||!alive||audio.currentTime<nextBeat)return;nextBeat=audio.currentTime+.18;const seq=[110,164,220,196,146,220,261,196],f=seq[beat%8];tone(f,.16,.08,'square');if(beat%4===0)tone(70,.16,.12,'sine');beat++}function burst(x,y,col,n=20){for(let i=0;i<n;i++){const a=R()*6.283,s=50+R()*200;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.25+R()*.55,col,r:1+R()*4})}}function fire(){if(!alive||fireCd>0)return;for(const dx of [-12,12])bullets.push({x:p.x+dx,y:p.y-25});fireCd=.16;tone(700,.08,.035,'square')}function hurt(){if(inv>0)return;inv=1.4;burst(p.x,p.y,'#40dfff',25);shield-=34;if(shield<0){shield=100;lives--;if(lives<=0){alive=false}}hudUpdate();tone(170,.25,.11)}function polygon(points,fill,stroke='#9fcde8'){g.beginPath();points.forEach((v,i)=>i?g.lineTo(v[0],v[1]):g.moveTo(v[0],v[1]));g.closePath();g.fillStyle=fill;g.fill();g.lineWidth=1.5;g.strokeStyle=stroke;g.stroke()}function craft(x,y,scale,enemy=false,tilt=0){g.save();g.translate(x,y);g.rotate(tilt);g.scale(scale,scale);const steel=g.createLinearGradient(-35,-28,35,24);steel.addColorStop(0,enemy?'#a33d54':'#b9d7e7');steel.addColorStop(.35,enemy?'#4c172d':'#40576f');steel.addColorStop(.65,'#111c32');steel.addColorStop(1,enemy?'#d65c6a':'#c4dce5');polygon([[0,-35],[-12,-12],[-34,10],[-30,26],[-11,14],[0,23],[11,14],[30,26],[34,10],[12,-12]],steel,enemy?'#ff6679':'#a2e8ff');polygon([[0,-29],[-9,-4],[0,12],[9,-4]],enemy?'#ff663b':'#36cfff','#f5ffff');for(const side of [-1,1]){polygon([[side*14,-8],[side*32,12],[side*26,18],[side*12,9]],enemy?'#822b4c':'#637e9c');g.fillStyle=enemy?'#ff4b36':'#29d7ff';g.shadowColor=g.fillStyle;g.shadowBlur=15;g.fillRect(side*18-4,19,8,9+Math.sin(tm*35)*5);g.shadowBlur=0}g.restore()}function frame(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;tm+=dt;g.fillStyle='#030916';g.fillRect(0,0,480,640);const neb=g.createRadialGradient(300+Math.sin(tm*.1)*30,260,10,250,300,370);neb.addColorStop(0,'#182b65');neb.addColorStop(.5,'#0d1839');neb.addColorStop(1,'#030916');g.fillStyle=neb;g.fillRect(0,0,480,640);stars.forEach(s=>{s.y+=s.s*dt*25;if(s.y>640)s.y=0;g.fillStyle=s.s>2?'#c3eaff':'#5a80b5';g.fillRect(s.x,s.y,s.s,s.s*2)});g.save();g.globalAlpha=.45;g.fillStyle='#4c658c';g.beginPath();g.arc(390,(tm*9)%850-100,75,0,7);g.fill();g.strokeStyle='#9bc9e0';g.lineWidth=8;g.beginPath();g.ellipse(390,(tm*9)%850-100,115,25,-.25,0,7);g.stroke();g.restore();
if(alive){musicStep();const dx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0)+joy.x,dy=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0)+joy.y;p.x=Math.max(42,Math.min(438,p.x+dx*270*dt));p.y=Math.max(45,Math.min(590,p.y+dy*270*dt));p.tilt+=(dx*.25-p.tilt)*Math.min(1,dt*7);if(shooting||keys.Space)fire();fireCd=Math.max(0,fireCd-dt);inv=Math.max(0,inv-dt);spawn-=dt;if(!boss&&kill>=12+level*3){foes=[];eb=[];boss={x:240,y:100,hp:20+level*8,max:20+level*8,phase:0};enemyCd=0}if(!boss&&spawn<=0){for(let i=0;i<3;i++)foes.push({x:75+i*155,y:-i*65-30,hp:2,seed:R()*7});spawn=Math.max(.75,2.2-level*.1)}foes.forEach(e=>{e.y+=(100+level*12)*dt;e.x+=Math.sin(tm*3+e.seed)*45*dt});foes=foes.filter(e=>e.y<690);if(boss){boss.phase+=dt;boss.x=240+Math.sin(boss.phase*1.5)*120;enemyCd-=dt;if(enemyCd<=0){for(const x of [-65,-32,0,32,65]){const angle=Math.atan2(p.y-boss.y,p.x-(boss.x+x));eb.push({x:boss.x+x,y:boss.y+38,vx:Math.cos(angle)*200,vy:Math.sin(angle)*200})}enemyCd=.85}}else{enemyCd-=dt;if(enemyCd<=0&&foes.length){const e=foes[0];eb.push({x:e.x,y:e.y,vx:(p.x-e.x)*.22,vy:190});enemyCd=.65}}bullets.forEach(b=>b.y-=520*dt);eb.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];let hit=false;for(let j=foes.length-1;j>=0;j--){const e=foes[j];if(Math.abs(b.x-e.x)<26&&Math.abs(b.y-e.y)<27){e.hp--;hit=true;if(e.hp<=0){burst(e.x,e.y,'#ffb45c');foes.splice(j,1);kill++;score+=15;hudUpdate()}break}}if(!hit&&boss&&Math.abs(b.x-boss.x)<86&&Math.abs(b.y-boss.y)<47){boss.hp--;hit=true;burst(b.x,b.y,'#ffc36e',3);if(boss.hp<=0){burst(boss.x,boss.y,'#ffad47',90);boss=null;level++;kill=0;score+=level*100;eb=[];hudUpdate()}}if(hit||b.y<0)bullets.splice(i,1)}for(let i=eb.length-1;i>=0;i--){const b=eb[i];if(Math.abs(b.x-p.x)<20&&Math.abs(b.y-p.y)<24){eb.splice(i,1);hurt()}else if(b.y>660||b.x<0||b.x>480)eb.splice(i,1)}for(let i=foes.length-1;i>=0;i--)if(Math.abs(foes[i].x-p.x)<30&&Math.abs(foes[i].y-p.y)<32){burst(foes[i].x,foes[i].y,'#ffad45');foes.splice(i,1);hurt()}}foes.forEach(e=>craft(e.x,e.y,.85,true,Math.sin(tm*2+e.seed)*.17));if(boss){craft(boss.x,boss.y,2.4,true,Math.sin(tm)*.08);g.fillStyle='#a02233';g.fillRect(boss.x-90,boss.y-105,180,8);g.fillStyle='#ff6a45';g.fillRect(boss.x-90,boss.y-105,180*boss.hp/boss.max,8)}g.shadowColor='#32dfff';g.shadowBlur=12;g.fillStyle='#67efff';bullets.forEach(b=>g.fillRect(b.x-3,b.y-16,6,27));g.shadowColor='#ff6622';g.fillStyle='#ffb13d';eb.forEach(b=>g.fillRect(b.x-4,b.y-5,8,13));g.shadowBlur=0;sparks.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.t-=dt;g.globalAlpha=Math.max(0,Math.min(1,s.t*2));g.fillStyle=s.col;g.fillRect(s.x,s.y,s.r,s.r)});g.globalAlpha=1;sparks=sparks.filter(s=>s.t>0);if(alive){g.save();g.shadowColor='#00cfff';g.shadowBlur=23;g.strokeStyle=shield>30?'#2de7ff':'#ffc34e';g.lineWidth=5;g.beginPath();g.ellipse(p.x,p.y,43+Math.sin(tm*6)*2,51,0,0,7);g.stroke();g.shadowBlur=0;g.fillStyle='rgba(30,175,255,.09)';g.fill();g.restore();if(inv===0||Math.floor(tm*12)%2===0)craft(p.x,p.y,1,false,p.tilt)}else{g.fillStyle='rgba(0,0,0,.75)';g.fillRect(0,245,480,130);g.fillStyle='white';g.textAlign='center';g.font='bold 29px system-ui';g.fillText(lives<=0?'FIN DE PARTIDA':'FÉNIX GALÁCTICO PS1',240,305);g.font='18px system-ui';g.fillText('Tocá INICIAR para jugar',240,344)}requestAnimationFrame(frame)}document.querySelector('#start').onclick=init;document.querySelector('#mute').onclick=e=>{music=!music;e.target.textContent=music?'♫ Música ON':'♫ Música OFF';unlock()};const fireBtn=document.querySelector('#fire');fireBtn.onpointerdown=e=>{e.preventDefault();unlock();shooting=true;fireBtn.setPointerCapture(e.pointerId)};for(const ev of ['pointerup','pointercancel','lostpointercapture'])fireBtn.addEventListener(ev,()=>shooting=false);const pad=document.querySelector('#pad'),knob=document.querySelector('#knob');pad.onpointerdown=e=>{unlock();pad.setPointerCapture(e.pointerId);move(e)};pad.onpointermove=e=>{if(pad.hasPointerCapture(e.pointerId))move(e)};function move(e){const r=pad.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,dist=Math.max(1,Math.hypot(x,y)),lim=r.width*.32,k=Math.min(1,lim/dist);joy.x=x*k/lim;joy.y=y*k/lim;knob.style.transform='translate(calc(-50% + '+x*k+'px),calc(-50% + '+y*k+'px))'}for(const ev of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(ev,()=>{joy={x:0,y:0};knob.style.transform='translate(-50%,-50%)'});document.onkeydown=e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;unlock()};document.onkeyup=e=>keys[e.code]=false;init();alive=false;requestAnimationFrame(frame)})();
</script></body></html>
