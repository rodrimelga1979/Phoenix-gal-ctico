<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Fénix Galáctico PS5 Edition</title><style>*{box-sizing:border-box}body{margin:0;background:#030816;color:#dff5ff;font:14px system-ui;text-align:center}main{max-width:540px;margin:auto;padding:8px}h2{margin:6px;font-size:20px;letter-spacing:1px}#stage{position:relative;width:100%;max-width:480px;aspect-ratio:3/4;margin:8px auto;border:2px solid #5bc9ed;background:#040c20;overflow:hidden}#stage canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:absolute;top:8px;left:8px;right:8px;text-align:left;text-shadow:0 2px 4px black;font-weight:700;pointer-events:none}#message{position:absolute;top:44%;width:100%;font-size:22px;font-weight:bold;text-shadow:0 2px 10px black;pointer-events:none}.controls{display:flex;align-items:center;justify-content:space-around;margin:12px}#pad{width:140px;height:140px;border-radius:50%;border:3px solid #76d6ff;background:radial-gradient(circle,#28567d,#0c1a38);position:relative;touch-action:none}#knob{width:57px;height:57px;border-radius:50%;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 30% 20%,white,#168cc5);box-shadow:0 0 12px #42cfff}button{color:white;background:#174266;border:2px solid #62c5f1;padding:12px;border-radius:12px;font-size:15px;font-weight:700}#fire{width:120px;height:85px;border-radius:50%;background:#9d2449;touch-action:none}small{display:block;margin:8px}</style></head><body><main><h2>FÉNIX GALÁCTICO · PS5 EDITION</h2><div id="stage"><div id="hud">Puntos 0 · Vidas 3 · Nivel 1 · Escudo 100%</div><div id="message">Cargando gráficos 3D...</div></div><div class="controls"><div id="pad"><div id="knob"></div></div><button id="fire">DISPARAR</button></div><button id="start">INICIAR / REINICIAR</button> <button id="music">♫ Música ON</button><small>Edición PS5: naves 3D refinadas, iluminación HDR, sombras, motores brillantes, escudo, jefes y controles táctiles. Requiere WebGL y conexión a Internet para cargar Three.js.</small></main><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const stage=document.querySelector('#stage'),hud=document.querySelector('#hud'),msg=document.querySelector('#message');
let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'default'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(stage.clientWidth,stage.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.85;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;stage.prepend(renderer.domElement)}catch(e){msg.textContent='Tu navegador no pudo iniciar WebGL';throw e}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x020719);scene.fog=new THREE.FogExp2(0x020719,.012);const camera=new THREE.PerspectiveCamera(48,.75,.1,250);camera.position.set(0,25,38);camera.lookAt(0,0,0);
scene.add(new THREE.HemisphereLight(0x9ddfff,0x161133,2));const sun=new THREE.DirectionalLight(0xffffff,3.1);sun.position.set(-12,20,15);scene.add(sun);sun.castShadow=true;const rim=new THREE.DirectionalLight(0x48dfff,3.5);rim.position.set(15,10,-18);scene.add(rim);const warm=new THREE.PointLight(0xff8552,35,55);warm.position.set(-15,5,-20);scene.add(warm);const blue=new THREE.PointLight(0x2b9bff,55,60);blue.position.set(12,6,-8);scene.add(blue);
const mat=(color,metalness=.7,roughness=.3,emissive=0)=>new THREE.MeshStandardMaterial({color,metalness,roughness,emissive,emissiveIntensity:emissive?1.3:0,flatShading:false});
const sparkle=new THREE.PointLight(0x6eefff,32,45);sparkle.position.set(0,7,8);scene.add(sparkle);const magenta=new THREE.PointLight(0xff4fd8,26,45);magenta.position.set(-12,9,4);scene.add(magenta);const hull=mat(0x7895ae,.85,.24),bright=mat(0xb7d5e7,.9,.2),dark=mat(0x1c304b,.75,.32),glass=mat(0x2ce0ff,.3,.12,0x08668e),engine=mat(0x6ceaff,.2,.2,0x13baff),red=mat(0x9c3857,.8,.3),redLight=mat(0xff6a38,.2,.25,0xff3b0b);
function mesh(parent,geometry,material,x=0,y=0,z=0){const o=new THREE.Mesh(geometry,material);o.position.set(x,y,z);parent.add(o);return o}
function fighter(enemy=false){const root=new THREE.Group(),body=enemy?red:hull,accent=enemy?redLight:engine;
const fus=mesh(root,new THREE.ConeGeometry(1.1,6.8,16),body,0,.3,-.3);fus.rotation.x=-Math.PI/2;
const wing=mesh(root,new THREE.BoxGeometry(8,.35,2.3),body,0,0,1.2);mesh(root,new THREE.BoxGeometry(1.8,.2,4.5),bright,0,.15,.3);wing.rotation.y=0;
for(const s of [-1,1]){const tip=mesh(root,new THREE.BoxGeometry(2,.3,2.8),bright,s*3,.05,1.7);tip.rotation.y=s*.32;mesh(root,new THREE.BoxGeometry(.23,.14,3.5),accent,s*3.35,.24,1.5);mesh(root,new THREE.BoxGeometry(.65,.65,1.2),dark,s*3.7,.35,1.8);mesh(root,new THREE.BoxGeometry(.15,.12,2.6),bright,s*2.15,.28,-.4);mesh(root,new THREE.BoxGeometry(.55,.3,3.2),dark,s*2.7,-.2,1);const jet=mesh(root,new THREE.CylinderGeometry(.48,.35,1.7,12),dark,s*1.5,-.25,2.2);jet.rotation.x=Math.PI/2;const flame=mesh(root,new THREE.ConeGeometry(.4,2.3,12),accent,s*1.5,-.25,3.4);flame.rotation.x=Math.PI/2;flame.userData.flame=true}
for(const s of [-1,1]){const fin=mesh(root,new THREE.BoxGeometry(.25,1.2,1.9),body,s*1.1,.7,2.2);fin.rotation.z=s*.2}mesh(root,new THREE.BoxGeometry(.25,.24,5.2),dark,0,.38,.2);for(const s of [-1,1]){mesh(root,new THREE.BoxGeometry(.14,.1,3.7),accent,s*1.6,.34,-.6);mesh(root,new THREE.BoxGeometry(.15,.1,1.8),bright,s*3.55,.33,1.8)}const cockpit=mesh(root,new THREE.SphereGeometry(.78,12,10),glass,0,.7,-.6);cockpit.scale.set(.7,.55,1.9);mesh(root,new THREE.BoxGeometry(1.1,.3,1.3),bright,0,.3,-2);root.rotation.y=enemy?Math.PI:0;return root}
const player=fighter();scene.add(player);const shieldMat=new THREE.MeshBasicMaterial({color:0x28cfff,transparent:true,opacity:.2,depthWrite:false,side:THREE.DoubleSide});const shieldMesh=mesh(scene,new THREE.SphereGeometry(5.1,24,16),shieldMat);shieldMesh.scale.set(1,0.45,1.15);const shieldWire=mesh(scene,new THREE.SphereGeometry(5.15,18,12),new THREE.MeshBasicMaterial({color:0x55edff,wireframe:true,transparent:true,opacity:.27}));shieldWire.scale.copy(shieldMesh.scale);
const nebula=mesh(scene,new THREE.SphereGeometry(95,32,24),new THREE.MeshBasicMaterial({color:0x132b66,side:THREE.BackSide,transparent:true,opacity:.34}),0,0,-45);const starGeo=new THREE.BufferGeometry(),positions=[];for(let i=0;i<2800;i++)positions.push((Math.random()-.5)*110,Math.random()*-15-4,(Math.random()-.5)*200);starGeo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));const starField=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xa8cfff,size:.22}));scene.add(starField);
const distant=mesh(scene,new THREE.SphereGeometry(2.8,24,18),mat(0xa7a9ba,.15,.8),-13,-22,-65);const moon=mesh(scene,new THREE.SphereGeometry(4.8,24,18),mat(0x879fb5,.1,.92),-25,-13,-38);const planet=mesh(scene,new THREE.SphereGeometry(12,32,24),mat(0x385a8b,.1,.85),22,-18,-45);const ring=mesh(scene,new THREE.RingGeometry(14,19,64),new THREE.MeshBasicMaterial({color:0x6885ae,side:THREE.DoubleSide,transparent:true,opacity:.5}),22,-18,-45);ring.rotation.x=-1.1;ring.rotation.z=.4;
const bulletGeo=new THREE.CylinderGeometry(.26,.1,2.8,12),enemyBulletGeo=new THREE.SphereGeometry(.35,8,6);let enemies=[],bullets=[],hostile=[],particles=[],boss=null,points=0,lives=3,level=1,shield=100,dead=true,time=0,spawn=0,kill=0,fireWait=0,enemyWait=0,inv=0,keys={},joy={x:0,y:0},shoot=false,audio=null,musicOn=true,nextNote=0,beat=0;
function audioStart(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}}function beep(freq,duration=.1,volume=.06,type='square'){if(!audio||audio.state!=='running')return;const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*.65),t+duration);g.gain.setValueAtTime(volume,t);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+duration)}function musicTick(){if(!musicOn||!audio||audio.state!=='running'||audio.currentTime<nextNote)return;nextNote=audio.currentTime+.18;beep([110,164,220,196,146,220,261,196][beat%8],.14,.09);if(beat%4===0)beep(65,.13,.12,'sine');beat++}
function hudUpdate(){hud.textContent='Puntos '+points+' · Vidas '+lives+' · Nivel '+level+' · Escudo '+Math.max(0,Math.ceil(shield))+'%'}
function clearObjects(arr){for(const item of arr)scene.remove(item.obj)}function reset(){clearObjects(enemies);clearObjects(bullets);clearObjects(hostile);clearObjects(particles);if(boss)scene.remove(boss.obj);enemies=[];bullets=[];hostile=[];particles=[];boss=null;points=0;lives=3;level=1;shield=100;dead=false;time=0;spawn=.5;kill=0;fireWait=0;enemyWait=0;inv=0;player.position.set(0,0,12);msg.textContent='';hudUpdate();audioStart()}
function burst(x,z,color=0xffb354,n=14){for(let i=0;i<n;i++){const o=mesh(scene,new THREE.IcosahedronGeometry(.13+Math.random()*.28,0),new THREE.MeshBasicMaterial({color}),x,0,z);const a=Math.random()*Math.PI*2,v=4+Math.random()*12;particles.push({obj:o,vx:Math.cos(a)*v,vz:Math.sin(a)*v,t:.3+Math.random()*.5})}}
function spawnEnemy(){for(let i=0;i<3;i++){const o=fighter(true);o.scale.setScalar(.72);o.position.set(-12+i*12,0,-40-i*5);scene.add(o);enemies.push({obj:o,hp:2,seed:Math.random()*7})}}
function spawnBoss(){clearObjects(enemies);enemies=[];clearObjects(hostile);hostile=[];const o=fighter(true);o.scale.set(3,2,2.7);o.position.set(0,0,-24);scene.add(o);boss={obj:o,hp:25+level*10,max:25+level*10,phase:0};enemyWait=0;msg.textContent='¡JEFE FINAL!';setTimeout(()=>{if(!dead)msg.textContent=''},1300)}
function shot(){if(dead||fireWait>0)return;for(const x of [-1.4,1.4]){const o=mesh(scene,bulletGeo,engine,player.position.x+x,0,player.position.z-3);bullets.push({obj:o})}fireWait=.16;beep(660,.08,.035)}
function enemyShot(x,z,vx=0){const o=mesh(scene,enemyBulletGeo,redLight,x,0,z);hostile.push({obj:o,vx})}
function damage(){if(inv>0||dead)return;inv=1.5;shield-=34;burst(player.position.x,player.position.z,0x2beaff,18);beep(180,.22,.1);if(shield<0){shield=100;lives--;if(lives<=0){dead=true;msg.textContent='FIN DEL JUEGO · Tocá INICIAR'}}hudUpdate()}
function update(dt){time+=dt;starField.position.z=(time*12)%40;planet.rotation.y+=dt*.03;moon.rotation.y+=dt*.07;ring.rotation.z+=dt*.015;for(const e of enemies)e.obj.rotation.z=Math.sin(time*3+e.seed)*.13;player.children.forEach(c=>{if(c.userData.flame)c.scale.y=.8+Math.sin(time*30)*.25});if(dead)return;musicTick();const dx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0)+joy.x,dz=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0)+joy.y;player.position.x=THREE.MathUtils.clamp(player.position.x+dx*18*dt,-17,17);player.position.z=THREE.MathUtils.clamp(player.position.z+dz*18*dt,-1,19);player.rotation.z+=(dx*-.25-player.rotation.z)*Math.min(1,dt*8);shieldMesh.position.copy(player.position);shieldWire.position.copy(player.position);shieldMesh.visible=shield>0;shieldWire.visible=shield>0;shieldMat.opacity=.13+Math.sin(time*7)*.06+(inv>0?.22:0);shieldWire.rotation.y+=dt*.6;magenta.position.x=player.position.x-7;magenta.position.z=player.position.z+3;sparkle.position.x=player.position.x;sparkle.position.z=player.position.z;blue.position.x=player.position.x;blue.position.z=player.position.z+5;inv=Math.max(0,inv-dt);fireWait=Math.max(0,fireWait-dt);if(shoot||keys.Space)shot();spawn-=dt;if(!boss&&kill>=12+level*3)spawnBoss();if(!boss&&spawn<=0){spawnEnemy();spawn=Math.max(1,2.4-level*.1)}for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];e.obj.position.z+=dt*(8+level);e.obj.position.x+=Math.sin(time*2+e.seed)*dt*2;if(e.obj.position.z>26){scene.remove(e.obj);enemies.splice(i,1)}else if(e.obj.position.distanceTo(player.position)<3.3){scene.remove(e.obj);enemies.splice(i,1);damage()}}
if(boss){boss.phase+=dt;boss.obj.position.x=Math.sin(boss.phase*1.2)*10;boss.obj.rotation.z=Math.sin(boss.phase)*.12}
enemyWait-=dt;if(enemyWait<=0){if(boss){for(const offset of [-6,-3,0,3,6])enemyShot(boss.obj.position.x+offset,boss.obj.position.z+3,(player.position.x-(boss.obj.position.x+offset))*.3);enemyWait=.7}else if(enemies.length){const e=enemies[0];enemyShot(e.obj.position.x,e.obj.position.z+2,(player.position.x-e.obj.position.x)*.2);enemyWait=.8}}
for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.obj.position.z-=dt*36;let hit=false;for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];if(Math.abs(b.obj.position.x-e.obj.position.x)<2.8&&Math.abs(b.obj.position.z-e.obj.position.z)<3){e.hp--;hit=true;if(e.hp<=0){burst(e.obj.position.x,e.obj.position.z);scene.remove(e.obj);enemies.splice(j,1);kill++;points+=15;hudUpdate()}break}}if(!hit&&boss&&Math.abs(b.obj.position.x-boss.obj.position.x)<7&&Math.abs(b.obj.position.z-boss.obj.position.z)<7){hit=true;boss.hp--;burst(b.obj.position.x,b.obj.position.z,0xffe5a3,3);if(boss.hp<=0){burst(boss.obj.position.x,boss.obj.position.z,0xffa22b,65);scene.remove(boss.obj);boss=null;level++;kill=0;points+=level*100;clearObjects(hostile);hostile=[];hudUpdate()}}if(hit||b.obj.position.z< -55){scene.remove(b.obj);bullets.splice(i,1)}}
for(let i=hostile.length-1;i>=0;i--){const b=hostile[i];b.obj.position.z+=dt*17;b.obj.position.x+=b.vx*dt;if(b.obj.position.distanceTo(player.position)<2.1){scene.remove(b.obj);hostile.splice(i,1);damage()}else if(b.obj.position.z>28){scene.remove(b.obj);hostile.splice(i,1)}}}
let prev=0;function loop(t){const dt=Math.min(.04,(t-prev)/1000||0);prev=t;update(dt);for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.t-=dt;p.obj.position.x+=p.vx*dt;p.obj.position.z+=p.vz*dt;p.obj.scale.setScalar(Math.max(.01,p.t));if(p.t<=0){scene.remove(p.obj);particles.splice(i,1)}}renderer.render(scene,camera);requestAnimationFrame(loop)}function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();document.querySelector('#start').onclick=reset;document.querySelector('#music').onclick=e=>{audioStart();musicOn=!musicOn;e.target.textContent=musicOn?'♫ Música ON':'♫ Música OFF'};const fire=document.querySelector('#fire');fire.onpointerdown=e=>{e.preventDefault();audioStart();shoot=true;fire.setPointerCapture(e.pointerId)};for(const ev of ['pointerup','pointercancel','lostpointercapture'])fire.addEventListener(ev,()=>shoot=false);const pad=document.querySelector('#pad'),knob=document.querySelector('#knob');function move(e){const r=pad.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,dist=Math.max(1,Math.hypot(x,y)),lim=r.width*.32,k=Math.min(1,lim/dist);joy.x=x*k/lim;joy.y=y*k/lim;knob.style.transform='translate(calc(-50% + '+x*k+'px),calc(-50% + '+y*k+'px))'}pad.onpointerdown=e=>{e.preventDefault();audioStart();pad.setPointerCapture(e.pointerId);move(e)};pad.onpointermove=e=>{if(pad.hasPointerCapture(e.pointerId))move(e)};for(const ev of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(ev,()=>{joy={x:0,y:0};knob.style.transform='translate(-50%,-50%)'});document.onkeydown=e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;audioStart()};document.onkeyup=e=>keys[e.code]=false;player.position.set(0,0,12);shieldMesh.position.copy(player.position);shieldWire.position.copy(player.position);msg.textContent='Tocá INICIAR para jugar';requestAnimationFrame(loop);
</script></body></html>
